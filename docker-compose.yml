# Revivo — cópia local do site WordPress
# Site:        http://localhost:8080
# phpMyAdmin:  http://localhost:8081
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
    volumes:
      # ficheiros do WordPress visíveis e editáveis em ./wordpress
      - ./wordpress:/var/www/html
      # limites maiores para importar o export do site
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      # plugin Revivo Pedidos (código em ./plugins)
      - ./plugins/revivo-pedidos:/var/www/html/wp-content/plugins/revivo-pedidos

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 1G

  # WP-CLI: docker compose run --rm cli <comando>
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - ./wordpress:/var/www/html
      - ./plugins/revivo-pedidos:/var/www/html/wp-content/plugins/revivo-pedidos

volumes:
  db_data:
